<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="style.css" rel="stylesheet">

        <!-- Basic Icons -->
        <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
        <!-- Filled Icons -->
        <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
        <!-- Brand Icons -->
        <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="row vh-100 g-0">
            <!-- Left Side -->
            <div class="col-lg-6 position-relative d-none d-lg-block">
                <div class="bg-holder" style="background-image: url(images/bg.jpg);"></div>
            </div>

            <!-- Right Side -->
            <div class="col-lg-6">
                <div class="row align-items-center justify-content-center h-100 g-0 px-4 px-sm-0">
                    <div class="col col-sm-6 col-lg-7 col-xl-6">

                        <!-- Logo -->
                        <a href="#" class="brand-lockup mb-4" aria-label="DENDEV home">
                            <span class="brand-mark" aria-hidden="true">D</span>
                            <span class="brand-copy">
                                <span class="brand-name">DENDEV</span>
                                <span class="brand-tagline">Digital Solutions</span>
                            </span>
                        </a>
                        <div class="text-center mb-5">
                            <h3 class="fw-bold">Log In</h3>
                            <p class="text-secondary">Get access to your account</p>
                        </div>

                        <!--Social Login -->
                        <button class="btn btn-lg btn-outline-secondary btn-outline-custom w-100 mb-3"> <i class="bxl bx-google text-danger me-1 fs-6"></i> Login with Google</button>
                        <button class="btn btn-lg btn-outline-secondary btn-outline-custom w-100 mb-3"> <i class="bxl bx-facebook text-primary me-1 fs-6"></i> Login with Facebook</button>

                        <!-- Divider -->
                        <div class="position-relative">
                            <hr class="text-secondary divider">
                            <div class="divider-content-center">or</div>
                        </div>

                        <!-- Form -->
                         <form action="#">
                            <div class="input-group mb-3">
                                <span class="input-group-text">
                                    <i class="bx bx-user"></i>
                                </span>
                                <input type="text" class="form-control form-control-lg fs-6" placeholder="Username">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text">
                                    <i class="bx bx-lock"></i>
                                </span>
                                <input type="password" class="form-control form-control-lg fs-6" placeholder="Password">
                            </div>
                            <div class="input-group mb-3 d-flex justify-content-between">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="formCheck">
                                    <label class="form-check-label text-secondary" for="formCheck"><small>Remember Me</small></label>
                                </div>
                                <div>
                                    <small>
                                        <a href="#">Forgot Password?</a>
                                    </small>
                                </div>
                            </div>
                            <button class="btn btn-primary btn-lg w-100 mb-3">Log In</button>
                         </form>

                         <div class="text-center">
                            <small>Don't have an account? <a href="#">Sign up</a></small>
                         </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
    </body>
</html>
